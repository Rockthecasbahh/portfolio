# Docker Compose Configuration for OpenMediaVault (OMV) / Home Server
# Runs Strapi v5 Headless CMS with Cloudflare Tunnel (cloudflared)
#
# Requirements:
# 1. Fill in your Strapi security secrets and Cloudflare TUNNEL_TOKEN in the environment or an accompanying .env file.
# 2. Deploy via OMV Workbench (Services > Compose > Files) or docker compose -f docker-compose.server.yml up -d.

services:
  strapi:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: portfolio-strapi
    restart: unless-stopped
    ports:
      - "1337:1337"
    environment:
      - HOST=0.0.0.0
      - PORT=1337
      - NODE_ENV=production
      - DATABASE_CLIENT=sqlite
      - DATABASE_FILENAME=.tmp/data.db
      - APP_KEYS=${STRAPI_APP_KEYS:-"devKey1,devKey2,devKey3,devKey4"}
      - API_TOKEN_SALT=${STRAPI_API_TOKEN_SALT:-"devApiTokenSalt1234567890"}
      - ADMIN_JWT_SECRET=${STRAPI_ADMIN_JWT_SECRET:-"devAdminJwtSecret1234567890"}
      - TRANSFER_TOKEN_SALT=${STRAPI_TRANSFER_TOKEN_SALT:-"devTransferSalt1234567890"}
      - JWT_SECRET=${STRAPI_JWT_SECRET:-"devJwtSecret1234567890"}
      - STRAPI_PAGE_BUILDER_API_KEY=${STRAPI_PAGE_BUILDER_API_KEY:-"b88aa5ad445af0080f9b4adfcb7b19c6"}
    volumes:
      # Persistent SQLite database storage on your OMV drive
      - strapi-data:/opt/app/.tmp
      # Persistent media uploads (images, PDFs)
      - strapi-uploads:/opt/app/public/uploads

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: portfolio-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Generate this token once in Cloudflare Zero Trust (Networks > Tunnels)
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-""}
    depends_on:
      - strapi

volumes:
  strapi-data:
    driver: local
  strapi-uploads:
    driver: local
