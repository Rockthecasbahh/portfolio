# Docker Compose Configuration for OpenMediaVault (OMV) / Home Server
# Runs Strapi v5 Headless CMS with Cloudflare Tunnel (cloudflared)
#
# Builds directly from GitHub so you do NOT need to manually copy server files to OMV!

services:
  strapi:
    image: strapi-server:latest
    container_name: portfolio-strapi
    restart: unless-stopped
    ports:
      - "${STRAPI_BIND_IP:-192.168.50.146}:1337:1337"
    security_opt:
      - no-new-privileges:true
    environment:
      - HOST=0.0.0.0
      - PORT=1337
      - NODE_ENV=production
      - DATABASE_CLIENT=sqlite
      - DATABASE_FILENAME=.tmp/data.db
      - APP_KEYS=${STRAPI_APP_KEYS:?Set STRAPI_APP_KEYS in .env}
      - API_TOKEN_SALT=${STRAPI_API_TOKEN_SALT:?Set STRAPI_API_TOKEN_SALT in .env}
      - ADMIN_JWT_SECRET=${STRAPI_ADMIN_JWT_SECRET:?Set STRAPI_ADMIN_JWT_SECRET in .env}
      - TRANSFER_TOKEN_SALT=${STRAPI_TRANSFER_TOKEN_SALT:?Set STRAPI_TRANSFER_TOKEN_SALT in .env}
      - JWT_SECRET=${STRAPI_JWT_SECRET:?Set STRAPI_JWT_SECRET in .env}
      - STRAPI_PAGE_BUILDER_API_KEY=${STRAPI_PAGE_BUILDER_API_KEY:-"b88aa5ad445af0080f9b4adfcb7b19c6"}
      - STRAPI_PAGE_BUILDER_EDITOR_URL=${STRAPI_PAGE_BUILDER_EDITOR_URL:-"https://matteocasling.com/editor"}
    volumes:
      # Persistent SQLite database storage on your OMV drive
      - strapi-data:/opt/app/.tmp
      # Persistent media uploads (images, PDFs)
      - strapi-uploads:/opt/app/public/uploads

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: portfolio-cloudflared
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: tunnel --no-autoupdate run
    environment:
      # Paste your Cloudflare Zero Trust Tunnel Token below:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-""}
    depends_on:
      - strapi

volumes:
  strapi-data:
    driver: local
  strapi-uploads:
    driver: local
