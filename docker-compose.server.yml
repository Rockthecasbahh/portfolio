# Docker Compose Configuration for OpenMediaVault (OMV) / Home Server
# Runs Strapi v5 Headless CMS with Cloudflare Tunnel (cloudflared)
#
# Builds directly from GitHub so you do NOT need to manually copy server files to OMV!

services:
  strapi:
    image: strapi-server:latest
    container_name: portfolio-strapi
    restart: unless-stopped
    ports:
      - "1337:1337"
    environment:
      - HOST=0.0.0.0
      - PORT=1337
      - NODE_ENV=production
      - DATABASE_CLIENT=sqlite
      - DATABASE_FILENAME=.tmp/data.db
      - APP_KEYS=${STRAPI_APP_KEYS:-"f82e3914a1c5d988b01e,e84f2913b2c4e977a12d"}
      - API_TOKEN_SALT=${STRAPI_API_TOKEN_SALT:-"salt_e71a93bd8c42a0b1"}
      - ADMIN_JWT_SECRET=${STRAPI_ADMIN_JWT_SECRET:-"admin_jwt_b38c2910f54e61aa"}
      - TRANSFER_TOKEN_SALT=${STRAPI_TRANSFER_TOKEN_SALT:-"transfer_931bfa8201de5c"}
      - JWT_SECRET=${STRAPI_JWT_SECRET:-"jwt_5719abde02c48831"}
      - STRAPI_PAGE_BUILDER_API_KEY=${STRAPI_PAGE_BUILDER_API_KEY:-"b88aa5ad445af0080f9b4adfcb7b19c6"}
    volumes:
      # Persistent SQLite database storage on your OMV drive
      - strapi-data:/opt/app/.tmp
      # Persistent media uploads (images, PDFs)
      - strapi-uploads:/opt/app/public/uploads

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: portfolio-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Paste your Cloudflare Zero Trust Tunnel Token below:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-""}
    depends_on:
      - strapi

volumes:
  strapi-data:
    driver: local
  strapi-uploads:
    driver: local
